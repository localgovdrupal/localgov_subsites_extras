services:
  localgov_subsites_extras.service:
    class: Drupal\localgov_subsites_extras\Service\SubsiteService
    arguments: ['@entity_type.manager', '@plugin.manager.menu.link', '@current_route_match', '@config.factory']
  cache_context.subsites:
    class: Drupal\localgov_subsites_extras\Cache\SubsitesCacheContext
    arguments:
      - '@localgov_subsites_extras.service'
    tags:
      - { name: cache.context }
  cache_context.subsites.theme:
    class: Drupal\localgov_subsites_extras\Cache\SubsitesThemeCacheContext
    arguments:
      - '@localgov_subsites_extras.service'
    tags:
      - { name: cache.context }
  cache_context.subsites.homepage:
    class: Drupal\localgov_subsites_extras\Cache\SubsitesHomePageCacheContext
    arguments:
      - '@localgov_subsites_extras.service'
    tags:
      - { name: cache.context }
